<h1>30-day lowest price log for your Black Friday sale: the 'was' price the EU rule needs, for every product in your Shopify or WooCommerce shop</h1>
<p class="meta">Updated 20 Oct 2026 · Disclosure: the product tracker linked below is an Unadhi product on the Apify Store. This guide is free, and the sheet also works with your shop's own product export (step 2). Current Apify pricing is only on the Store page.</p>
<div class="answer"><p><strong>What you get:</strong> one Google Sheet for a shop that sells to consumers in the EU. It keeps a <strong>daily log of your own shop's prices</strong> and shows, for <strong>every product in your sale</strong>, the <strong>lowest price you charged in the log</strong> (the "was" price Article 6a of the EU Price Indication Directive asks for), your planned sale price, the <strong>real % off</strong>, how many days the log covers, and flags: <strong>not a reduction</strong>, <strong>fewer than 30 days logged</strong>, <strong>no data for this product</strong> and <strong>your "was" price is above the 30-day lowest</strong>. Start today: for Black Friday on <strong>Friday 27 November 2026</strong> the log has to begin by <strong>Wednesday 28 October</strong>.</p></div>

<h2>The finished sheet</h2>
<h3>sale tab (with the formula columns)</h3>
<table><thead><tr><th>Product</th><th>Days logged</th><th>Lowest in log</th><th>Shop price now</th><th>Sale price</th><th>Real % off</th><th>Flag</th></tr></thead><tbody>
<tr><td>Wool scarf, grey</td><td>31</td><td>€39.00</td><td>€49.00</td><td>€29.00</td><td>26%</td><td>OK: show €39.00 as the was price · Your shop's was price is above the 30-day lowest</td></tr>
<tr><td>Ceramic mug set</td><td>31</td><td>€24.00</td><td>€24.00</td><td>€24.00</td><td>0%</td><td>Not a reduction</td></tr>
<tr><td>Candle, large</td><td>12</td><td>€18.00</td><td>€18.00</td><td>€14.00</td><td>22%</td><td>Fewer than 30 days logged</td></tr>
</tbody></table>
<p class="meta">Example rows only, to show the layout. Not real products or prices. In row one the shop raised the price from €39 to €49 in the last weeks, so €49 cannot be the was price.</p>

<h2>Who this is for</h2>
<ul>
<li><strong>Shopify and WooCommerce shops</strong> that sell to consumers in an EU country and plan a Black Friday, Black Week or Cyber Monday sale.</li>
<li><strong>Agencies and freelancers</strong> who run sales for several shops and want one check per shop before the banners go live.</li>
<li><strong>Shops outside the EU</strong> that sell to EU consumers and show "was" prices or "% off": check whether the rule applies to you.</li>
</ul>
<p>Checking competitors' discounts instead? Use the <a href="competitor-store-discount-sheet-black-friday.html">competitor discount sheet for Black Friday</a>.</p>

<h2>The rule in one paragraph</h2>
<p>Under Article 6a of Directive 98/6/EC (added by Directive (EU) 2019/2161), any announcement of a price reduction must show the <strong>prior price</strong>: the lowest price you applied during a period of not less than 30 days before the reduction. Earlier sale prices in those 30 days count. The Court of Justice held in case C-330/23 (26 September 2024) that a "% off" or a claim such as "price highlight" must be calculated from that prior price, so the sale price can never be equal to or above it. Countries may set different rules for goods that go off quickly, products on the market for less than 30 days, and reductions that increase step by step; check your country's law for those cases.</p>

<h2>Dates for Black Friday 2026</h2>
<table><thead><tr><th>Your sale starts</th><th>Log your prices from</th></tr></thead><tbody>
<tr><td>Monday 23 November (Black Week)</td><td>Saturday 24 October</td></tr>
<tr><td>Friday 27 November (Black Friday)</td><td>Wednesday 28 October</td></tr>
<tr><td>Monday 30 November (Cyber Monday)</td><td>Saturday 31 October</td></tr>
</tbody></table>
<p>Starting earlier does no harm: the sheet uses the lowest price in the whole log, and the Commission's guidance says a prior price lower than the 30-day lowest is not contrary to Article 6a.</p>

<h2>Step 1: settings</h2>
<p>Tab <code>settings</code>: from cell A2 down, the name of each daily tab, one per line (for example <code>d_2026-10-28</code>, <code>d_2026-10-29</code>, …). Put the newest at the bottom. B1: the number of days you need (30).</p>

<h2>Step 2: one CSV of your own prices per day</h2>
<h3>No code (Apify)</h3>
<ol>
<li>Open <a href="https://apify.com/laudable_instrument/ecommerce-product-data-half-price?utm_source=unadhi-guides&amp;utm_medium=organic&amp;utm_campaign=apify_eu_30day_price">Shopify &amp; WooCommerce Product + Price Tracker</a> and click <strong>Try for free</strong>.</li>
<li>Enter your own shop address. In JSON view:</li>
</ol>
<pre><code>{
  "startUrls": [ { "url": "https://your-shop.eu" } ],
  "maxProductsPerShop": 1000,
  "maxListingPages": 50,
  "includeDescription": false
}</code></pre>
<p>Set <code>maxProductsPerShop</code> above your number of products (the default is 100). Save the input as an Apify Task and add a daily Schedule, so it runs at the same time every day. After each run, open the dataset, choose <strong>Export → CSV</strong> and import it into a new tab named with the date (File → Import → Upload → Insert new sheet). Do not rename headers. Run datasets are deleted after a retention period that depends on your Apify plan, so import at least every few days. Check the run's <strong>Storage → Key-value store → SHOPS_SUMMARY</strong> once: your shop should show <code>ok</code>.</p>
<h3>Free, from your own shop admin</h3>
<ul>
<li>Shopify: the admin product export (Products → Export) gives one row per variant with the columns <code>Handle</code>, <code>Variant Price</code> and <code>Variant Compare At Price</code>.</li>
<li>WooCommerce: the built-in product CSV exporter (Products → Export) gives <code>Regular price</code> and <code>Sale price</code>.</li>
</ul>
<p>The formulas below look columns up by header name. With an admin export, change <code>"url"</code> to your product key column (<code>Handle</code> or <code>SKU</code>) and <code>"price"</code> to the price column; for WooCommerce, log the sale price when one is set, because it is the price customers paid that day.</p>

<h2>Step 3: what the tracker columns mean</h2>
<ul>
<li><code>url</code> is the product's address in your shop. For Shopify it is always written as <code>shop/products/handle</code>, so copy it from the CSV.</li>
<li><code>price</code> is the price shown that day; <code>compareAtPrice</code> is the struck-through "was" price your shop shows, if any. For a Shopify product with several sizes, the row's <code>price</code> is the <strong>cheapest variant</strong>.</li>
<li>Each size has its own columns: <code>variants/0/title</code>, <code>variants/0/price</code>, <code>variants/0/compareAtPrice</code>, then <code>variants/1/…</code>. <code>scrapedAt</code> is the time of the run in UTC.</li>
</ul>

<h2>Step 4: the sale tab</h2>
<p>Format column A as Plain text. One row per product in your sale: A url (from the CSV), B variant no. (blank for the row price, or the N of the <code>variants/N/title</code> column showing your size), C product name, D your planned sale price, E any lower price you ran that the daily log could not see (for example a flash sale between two runs; otherwise blank).</p>

<h2>Step 5: the formula columns</h2>
<p>Put the formulas below in row 2 and copy them down. F2, days logged:</p>
<pre><code>=IF($A2="","",LET(tabs, FILTER(settings!$A$2:$A, settings!$A$2:$A&lt;&gt;""),
  p, MAP(tabs, LAMBDA(t, LET(R, INDIRECT("'"&amp;t&amp;"'!A:ZZ"), H, INDEX(R, 1, 0),
    r, MATCH($A2, INDEX(R, 0, MATCH("url", H, 0)), 0),
    IFERROR(N(INDEX(R, r, MATCH(IF($B2="", "price", "variants/"&amp;$B2&amp;"/price"), H, 0))), 0)))),
  SUM(--(p&gt;0))))</code></pre>
<p>G2, lowest price in the log: the same formula with the last line changed to</p>
<pre><code>  IFERROR(MIN(FILTER(p, p&gt;0), IF(ISNUMBER($E2), $E2, 9E+99)), "no data")))</code></pre>
<p>H2, shop price now: the same formula with the last line changed to</p>
<pre><code>  LET(x, INDEX(p, ROWS(p)), IF(x&gt;0, x, "missing"))))</code></pre>
<p>I2, your shop's current "was" price: the H2 formula with <code>"price"</code> changed to <code>"compareAtPrice"</code> and <code>"/price"</code> changed to <code>"/compareAtPrice"</code>. Then:</p>
<pre><code>J2 real % off:  =IF(AND(ISNUMBER(G2), ISNUMBER(D2)), 1-D2/G2, "")
K2 flag:
=IF($A2="","",LET(f, TEXTJOIN(" · ", TRUE,
  IF(NOT(ISNUMBER(G2)), "No data for this product", ""),
  IF(AND(ISNUMBER(F2), F2&lt;settings!$B$1), "Fewer than "&amp;settings!$B$1&amp;" days logged", ""),
  IF(AND(ISNUMBER(G2), ISNUMBER(D2)), IF(D2&gt;=G2, "Not a reduction", ""), ""),
  IF(AND(ISNUMBER(I2), I2&gt;0, ISNUMBER(G2)), IF(I2&gt;G2, "Your shop's was price is above the 30-day lowest", ""), "")),
  IF(OR(f="", f="Your shop's was price is above the 30-day lowest"), "OK: show "&amp;TEXT(G2, "0.00")&amp;" as the was price"&amp;IF(f="", "", " · "&amp;f), f)))</code></pre>
<p>Format J as a percentage. Each day: import the new CSV and add its tab name at the bottom of settings column A. Nothing else changes. A product that is missing on a day (sold out and hidden, or renamed) simply has no price for that day.</p>

<h2>What to do with each flag</h2>
<table><thead><tr><th>Flag</th><th>What to do</th></tr></thead><tbody>
<tr><td>OK: show X as the was price</td><td>Use X as the struck-through or "before" price, and calculate any "% off" from X.</td></tr>
<tr><td>Not a reduction</td><td>Your sale price is not below the lowest price of the period. Lower the sale price, or sell it at that price without a reduction claim.</td></tr>
<tr><td>Fewer than 30 days logged</td><td>You cannot yet prove the 30-day lowest from this log. Wait, or use another record of your prices (orders, price change history). If the product has been on sale for less than 30 days, check whether your country allows a shorter period.</td></tr>
<tr><td>No data for this product</td><td>Check the url in column A and the variant number; the product may have been hidden on every run.</td></tr>
<tr><td>Your shop's was price is above the 30-day lowest</td><td>Before the sale, change the product's compare-at or regular price to the lowest price in column G, so the banner does not show a higher "was" price.</td></tr>
</tbody></table>

<h2>Check before the banners go live</h2>
<ul class="check">
<li>The log covers at least 30 days before the first day of the sale for every product in it.</li>
<li>Prices in the log are in the currency and tax basis your customers see (EU consumer prices include VAT).</li>
<li>Rows with a variant number show the price of the right size (spot-check three in your shop).</li>
<li>Any flash sale, discount you ran in the period and the log missed is entered in column E.</li>
<li>Every "% off" in banners, emails and ads is calculated from column G, not from your usual price.</li>
</ul>
<p class="meta">General information, not legal advice. National rules (for example on perishable goods, new products or loyalty prices) and the UK's own rules are not covered here.</p>
