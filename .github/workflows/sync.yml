name: sync-site
on:
  push:
    branches: [main]
    paths: [source_url.txt, files.txt, decode_cf.py, .github/workflows/sync.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: sync-site
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror site from origin
        run: |
          SRC=$(tr -d ' \r\n' < source_url.txt)
          # 2026-10-07 fix: a "?v=..." cache-buster in source_url.txt made "$SRC/$f" a query on "/",
          # so every page was mirrored as the home page (live since 29 Sep). Strip query/fragment + trailing slash.
          SRC=${SRC%%\#*}; SRC=${SRC%%\?*}; SRC=${SRC%/}
          echo "SRC=$SRC" >> $GITHUB_ENV
          mkdir -p /tmp/out
          while read -r f; do
            [ -z "$f" ] && continue
            curl -fsSL --retry 3 "$SRC/$f" -o "/tmp/out/$f"
          done < files.txt
          python3 decode_cf.py /tmp/out/*.html
          grep -q HaanJi /tmp/out/index.html
          ! grep -l cdn-cgi /tmp/out/*.html
          # each page must carry its own title (refuse to publish home-page copies)
          check(){ grep -qi "<title>[^<]*$2" "/tmp/out/$1" || { echo "BAD $1: title lacks '$2'"; exit 1; }; }
          check about.html About; check contact.html Contact; check pay.html Pay; check pricing.html Pricing
          check privacy.html Privacy; check refund.html Refund; check shipping.html Shipping; check terms.html Terms
          check book.html Book
          grep -q UPI /tmp/out/pay.html
          for f in /tmp/out/*.html; do [ "$f" = /tmp/out/index.html ] && continue
            cmp -s "$f" /tmp/out/index.html && { echo "BAD $f identical to index.html"; exit 1; }; done
          cp /tmp/out/* .
          ls -la
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo no changes; exit 0; }
          git commit -qm "sync site from $SRC"
          git push
